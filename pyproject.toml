[project]
name = "doppler"
version = "0.1.0"
description = "Research pipeline for building and evaluating digital-twin agents that predict a person's held-out survey answers from partial information."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "python-dotenv==1.2.2",
    "google-genai==2.14.0",
    "tqdm==4.69.0",
    "scikit-learn==1.9.0",
    "torch==2.13.0",
    "sentence-transformers==5.6.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doppler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
